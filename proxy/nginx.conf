# Reverse proxy in front of the client and backend, so the browser only
# ever talks to one origin. Known backend paths go to the service
# container; everything else falls through to the client's static build.
#
# This lists backend paths explicitly rather than something like an
# /api prefix, since the backend doesn't use one today. Add a line here
# any time a new top-level REST path is added to the backend.
server {
    listen 80;

    location = /health {
        proxy_pass http://service:8080;
    }

    location /users {
        proxy_pass http://service:8080;
    }

    location /boards {
        proxy_pass http://service:8080;
    }

    location /games {
        proxy_pass http://service:8080;
    }

    location /ws/ {
        proxy_pass http://service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://client:80;
    }
}
